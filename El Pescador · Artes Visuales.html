<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Pescador · Artes Visuales</title>
<style>
  :root {
    --ivory: #f8f4ea;
    --paper: rgba(255, 255, 255, 0.8);
    --ink: #2a2622;
    --muted: #7a7066;
    --gold: #b08d57;
    --gold-soft: #e9dcc2;
    --teal: #1f4e5a;
    --line: #d9cdb6;
    --rose: #8b3a3a;
    --green: #2f6b4f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    font-family: Georgia, 'Times New Roman', serif;
    color: var(--ink);
    background: radial-gradient(circle at top, #fffdf7 0%, var(--ivory) 45%, #efe6d2 100%);
    display: flex; justify-content: center;
    padding: 16px;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap { width: 100%; max-width: 720px; display: flex; flex-direction: column; gap: 14px; }
  .card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 22px;
    box-shadow: 0 12px 30px -14px rgba(42, 38, 34, 0.28);
    backdrop-filter: blur(6px);
  }

  header.card {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
    gap: 12px; padding: 14px 18px;
  }
  .brand h1 { margin: 0; font-size: 26px; font-weight: 600; letter-spacing: 0.5px; color: var(--teal); }
  .brand p { margin: 3px 0 0; font-size: 10.5px; letter-spacing: 2.6px; text-transform: uppercase; color: var(--gold); }
  .controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  select, .btn {
    font-family: inherit; font-size: 14px; color: var(--ink);
    background: #fff; border: 1px solid var(--line); border-radius: 12px;
    padding: 8px 12px; cursor: pointer; transition: all 0.2s ease;
  }
  select:focus, .btn:focus { outline: none; border-color: var(--gold); }
  .btn:hover { border-color: var(--gold); background: #fffdf8; }
  .btn:active { transform: scale(0.97); }
  .streak {
    display: flex; flex-direction: column; align-items: center; padding: 4px 12px;
    border: 1px solid var(--gold-soft); border-radius: 12px; background: #fdf8ee;
  }
  .streak small { font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--gold); }
  .streak span { font-size: 16px; font-weight: 700; color: var(--teal); line-height: 1.1; }
  .audio-btn { padding: 8px 10px; line-height: 0; }
  .audio-btn svg { width: 18px; height: 18px; stroke: var(--teal); fill: none; stroke-width: 1.8; }

  .stage {
    padding: 18px 18px 22px; display: flex; flex-direction: column; align-items: center; gap: 16px;
    position: relative; overflow: hidden;
  }
  .stage-top { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .badge {
    font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: var(--teal);
    border: 1px solid var(--gold); border-radius: 999px; padding: 6px 14px; background: #fffdf8;
  }
  .basket { display: flex; align-items: center; gap: 8px; }
  .basket-label { font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); }
  .fish-row { display: flex; align-items: center; gap: 4px; }
  .fish { width: 30px; height: 20px; transition: opacity 0.5s ease, transform 0.5s ease, filter 0.5s ease; }
  .fish svg { width: 100%; height: 100%; display: block; }
  .fish.gone { opacity: 0.15; filter: grayscale(1); transform: scale(0.8); }
  .count { font-size: 13px; font-weight: 700; color: var(--teal); margin-left: 4px; }

  .status { font-size: 15px; font-style: italic; color: var(--muted); text-align: center; min-height: 22px; }
  .status.ok { color: var(--green); font-style: normal; font-weight: 700; }
  .status.bad { color: var(--rose); font-style: normal; font-weight: 700; }

  .word { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; min-height: 56px; }
  .slot {
    width: 36px; height: 48px; display: flex; align-items: center; justify-content: center;
    border-bottom: 2px solid var(--gold); font-size: 26px; font-weight: 600; color: var(--teal);
  }
  .slot span { opacity: 0; transform: translateY(6px); transition: all 0.35s ease; }
  .slot.open span { opacity: 1; transform: translateY(0); }

  .hint-box {
    width: 100%; background: #fdf8ee; border: 1px solid var(--gold-soft); border-radius: 16px;
    padding: 12px 16px; font-size: 14px; line-height: 1.5; color: var(--ink); text-align: center;
  }
  .hint-box.hidden { display: none; }
  .hint-box b {
    display: block; font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--gold); margin-bottom: 4px; font-weight: 700;
  }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }

  .keyboard { padding: 14px 12px 16px; display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .krow { display: flex; gap: 6px; justify-content: center; width: 100%; }
  .key {
    flex: 1; max-width: 50px; height: 44px; border-radius: 12px; border: 1px solid var(--line);
    background: #fff; color: var(--ink); font-family: inherit; font-size: 17px; cursor: pointer;
    transition: all 0.18s ease; box-shadow: 0 2px 0 var(--line);
  }
  .key:hover:not(:disabled) { border-color: var(--gold); transform: translateY(-1px); }
  .key:active:not(:disabled) { transform: translateY(1px); box-shadow: none; }
  .key:disabled { cursor: default; }
  .key.hit { background: var(--teal); color: #fff; border-color: var(--teal); box-shadow: none; }
  .key.miss { background: #f1ece2; color: #b5aa98; border-color: #ebe3d3; box-shadow: none; }

  .escapee {
    position: absolute; top: 78px; left: 50%; width: 46px; height: 28px; pointer-events: none; z-index: 5;
    animation: escape 1.1s cubic-bezier(.3,.6,.4,1) forwards;
  }
  .escapee svg { width: 100%; height: 100%; }
  @keyframes escape {
    0%   { transform: translate(-50%, 0) rotate(0deg); opacity: 1; }
    45%  { transform: translate(60px, -60px) rotate(-18deg); opacity: 1; }
    100% { transform: translate(160px, 90px) rotate(30deg); opacity: 0; }
  }
  .ripple {
    position: absolute; bottom: 14px; left: 50%; width: 80px; height: 14px; margin-left: -40px;
    border: 2px solid var(--teal); border-radius: 50%; opacity: 0; pointer-events: none;
    animation: ripple 0.9s ease-out forwards;
  }
  @keyframes ripple {
    0% { transform: scale(0.3); opacity: 0.8; }
    100% { transform: scale(1.4); opacity: 0; }
  }
  .shake { animation: shake 0.45s ease; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
  }

  .foot { text-align: center; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); padding: 4px 0 2px; }

  #modal {
    position: fixed; inset: 0; z-index: 50; background: rgba(42, 38, 34, 0.45);
    backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; padding: 18px;
  }
  #modal.open { display: flex; }
  .modal-card {
    background: #fffdf8; border: 1px solid var(--gold-soft); border-radius: 24px; padding: 28px 24px;
    max-width: 380px; width: 100%; text-align: center; box-shadow: 0 30px 60px -20px rgba(0,0,0,0.35);
    animation: rise 0.45s ease;
  }
  @keyframes rise { from { transform: translateY(16px); opacity: 0; } to { transform: none; opacity: 1; } }
  .modal-card .eyebrow { font-size: 10.5px; letter-spacing: 2.6px; text-transform: uppercase; color: var(--gold); }
  .modal-card h2 { margin: 6px 0 10px; font-size: 24px; font-weight: 600; color: var(--teal); }
  .modal-card .answer { font-size: 28px; letter-spacing: 3px; color: var(--ink); margin: 8px 0; font-weight: 600; word-break: break-word; }
  .modal-card p { font-size: 14px; line-height: 1.55; color: var(--muted); margin: 6px 0 18px; }
  .modal-card .btn { width: 100%; padding: 12px; font-size: 16px; background: var(--teal); color: #fff; border-color: var(--teal); }
  .modal-card .btn:hover { background: #173d47; }

  @media (max-width: 420px) {
    .brand h1 { font-size: 22px; }
    .slot { width: 30px; height: 42px; font-size: 22px; }
    .key { height: 40px; font-size: 15px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="card">
    <div class="brand">
      <h1>El Pescador</h1>
      <p>Juego de palabras · Artes Visuales</p>
    </div>
    <div class="controls">
      <select id="category" aria-label="Categoría">
        <option value="todas">Todas las categorías</option>
        <option value="dibujo">Dibujo Artístico</option>
        <option value="escultura">Escultura</option>
        <option value="grabado">Grabado Artístico</option>
        <option value="pintura">Pintura</option>
      </select>
      <div class="streak" title="Palabras adivinadas seguidas">
        <small>Racha</small>
        <span id="streak">0</span>
      </div>
      <button id="audio" class="btn audio-btn" aria-label="Activar o silenciar sonido" title="Sonido">
        <svg viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 010 7M19 5a10 10 0 010 14" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <section class="card stage" id="stage">
    <div class="stage-top">
      <span class="badge" id="badge">Pintura</span>
      <div class="basket">
        <span class="basket-label">Cesta</span>
        <div class="fish-row" id="fish-row"></div>
        <span class="count" id="count">5/5</span>
      </div>
    </div>

    <div class="status" id="status">Adivine la palabra antes de que escapen los peces.</div>

    <div class="word" id="word" aria-label="Palabra secreta"></div>

    <div class="hint-box hidden" id="hint">
      <b>Definición</b>
      <span id="hint-text"></span>
    </div>

    <div class="actions">
      <button class="btn" id="hint-btn">Pista</button>
      <button class="btn" id="skip-btn">Otra palabra</button>
    </div>
  </section>

  <section class="card keyboard" id="keyboard"></section>

  <div class="foot">Use el teclado de la pantalla o el de su computadora</div>
</div>

<div id="modal">
  <div class="modal-card">
    <div class="eyebrow" id="m-eyebrow"></div>
    <h2 id="m-title"></h2>
    <div class="answer" id="m-word"></div>
    <p id="m-def"></p>
    <button class="btn" id="m-btn">Jugar otra vez</button>
  </div>
</div>

/* ========================================================
   Sonido sintetizado (Web Audio, sin archivos externos)
   ======================================================== */
const Sound = {
  ctx: null, muted: false,
  init() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) this.ctx = new AC();
    }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },
  tone(freq, start, dur, type = 'sine', vol = 0.15, freqEnd = null) {
    const t = this.ctx.currentTime + start;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (freqEnd) o.frequency.exponentialRampToValueAtTime(freqEnd, t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  },
  play(name) {
    if (this.muted) return;
    this.init();
    if (!this.ctx) return;
    if (name === 'ok') { this.tone(523.25, 0, 0.25); this.tone(783.99, 0.1, 0.25); }
    if (name === 'splash') { this.tone(300, 0, 0.45, 'triangle', 0.12, 620); this.tone(180, 0.35, 0.2, 'sine', 0.12, 90); }
    if (name === 'win') [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => this.tone(f, i * 0.11, 0.35, 'triangle', 0.14));
    if (name === 'lose') [440, 392, 349.23, 293.66].forEach((f, i) => this.tone(f, i * 0.16, 0.35, 'sine', 0.12));
  }
};

const FISH_COLORS = [
  ['#e9c46a','#b08d57'], ['#e76f51','#9c4a33'], ['#2a9d8f','#1f4e5a'],
  ['#e5989b','#9d5b5f'], ['#8ecae6','#3d6e86']
];

const state = {
  category: 'todas',
  entry: null,
  guessed: new Set(),
  fish: MAX_FISH,
  streak: 0,
  over: false,
  used: new Set()
};

const $ = id => document.getElementById(id);

// Quita tildes y devuelve la letra base; conserva la Ñ
function baseLetter(ch) {
  if (ch === 'ñ' || ch === 'Ñ') return 'Ñ';
  const u = ch.toUpperCase();
  const plain = u.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  return /^[A-Z]$/.test(plain) ? plain : null;
}

function pickEntry(catKey) {
  const pool = [];
  const keys = catKey === 'todas' ? Object.keys(CATEGORIES) : [catKey];
  keys.forEach(k => {
    CATEGORIES[k].words.forEach(([word, def]) => pool.push({ word, def, label: CATEGORIES[k].label }));
  });
  let available = pool.filter(e => !state.used.has(e.word));
  if (!available.length) { state.used.clear(); available = pool; }
  const chosen = available[Math.floor(Math.random() * available.length)];
  state.used.add(chosen.word);
  return chosen;
}

/* ========================================================
   Dibujo
   ======================================================== */
const fishSVG = (color, fin) => `
  <svg viewBox="0 0 34 22" aria-hidden="true">
    <path d="M28 11C28 11 22 3 13 3C7 3 3 7 3 11C3 15 7 19 13 19C22 19 28 11 28 11Z" fill="${color}" stroke="${fin}" stroke-width="1.2"/>
    <path d="M27 11L33 5V17L27 11Z" fill="${fin}"/>
    <circle cx="9" cy="10" r="1.6" fill="#2a2622"/>
  </svg>`;

function renderFish() {
  const row = $('fish-row');
  row.innerHTML = '';
  for (let i = 0; i < MAX_FISH; i++) {
    const d = document.createElement('div');
    d.className = 'fish' + (i >= state.fish ? ' gone' : '');
    d.innerHTML = fishSVG(...FISH_COLORS[i]);
    row.appendChild(d);
  }
  $('count').textContent = `${state.fish}/${MAX_FISH}`;
}

function renderWord() {
  const box = $('word');
  box.innerHTML = '';
  [...state.entry.word].forEach(ch => {
    const slot = document.createElement('div');
    slot.className = 'slot';
    const L = baseLetter(ch);
    if (state.guessed.has(L)) slot.classList.add('open');
    const s = document.createElement('span');
    s.textContent = ch;
    slot.appendChild(s);
    box.appendChild(slot);
  });
}

function renderKeyboard() {
  const kb = $('keyboard');
  kb.innerHTML = '';
  const letters = new Set([...state.entry.word].map(baseLetter));
  ROWS.forEach(row => {
    const r = document.createElement('div');
    r.className = 'krow';
    row.forEach(L => {
      const b = document.createElement('button');
      b.className = 'key';
      b.textContent = L;
      if (state.guessed.has(L)) {
        b.disabled = true;
        b.classList.add(letters.has(L) ? 'hit' : 'miss');
      } else if (state.over) {
        b.disabled = true;
      }
      b.addEventListener('click', () => guess(L));
      r.appendChild(b);
    });
    kb.appendChild(r);
  });
}

function setStatus(text, cls = '') {
  const s = $('status');
  s.textContent = text;
  s.className = 'status ' + cls;
}

function renderAll() {
  $('badge').textContent = state.entry.label;
  $('hint-text').textContent = state.entry.def;
  $('hint').classList.add('hidden');
  renderFish();
  renderWord();
  renderKeyboard();
  $('streak').textContent = state.streak;
}

/* ========================================================
   Juego
   ======================================================== */
function newRound() {
  state.entry = pickEntry(state.category);
  state.guessed.clear();
  state.fish = MAX_FISH;
  state.over = false;
  setStatus('Adivine la palabra antes de que escapen los peces.');
  closeModal();
  renderAll();
}

function escapeFish() {
  const stage = $('stage');
  const f = document.createElement('div');
  f.className = 'escapee';
  f.innerHTML = fishSVG(...FISH_COLORS[state.fish % MAX_FISH]);
  stage.appendChild(f);
  f.addEventListener('animationend', () => f.remove());

  const r = document.createElement('div');
  r.className = 'ripple';
  stage.appendChild(r);
  r.addEventListener('animationend', () => r.remove());

  stage.classList.remove('shake');
  void stage.offsetWidth;
  stage.classList.add('shake');
}

function guess(letter) {
  if (state.over || state.guessed.has(letter)) return;
  state.guessed.add(letter);

  const letters = new Set([...state.entry.word].map(baseLetter));
  if (letters.has(letter)) {
    Sound.play('ok');
    setStatus(`¡Muy bien! La letra "${letter}" está en la palabra.`, 'ok');
    renderWord();
    renderKeyboard();
    if ([...letters].every(L => state.guessed.has(L))) win();
  } else {
    state.fish -= 1;
    Sound.play('splash');
    escapeFish();
    renderFish();
    renderKeyboard();
    if (state.fish > 0) {
      setStatus(`La "${letter}" no está. Escapó un pez (quedan ${state.fish}).`, 'bad');
    } else {
      lose();
    }
  }
}

function win() {
  state.over = true;
  state.streak += 1;
  Sound.play('win');
  renderKeyboard();
  $('streak').textContent = state.streak;
  setTimeout(() => showModal(true), 600);
}

function lose() {
  state.over = true;
  state.streak = 0;
  Sound.play('lose');
  renderKeyboard();
  $('streak').textContent = state.streak;
  setStatus('¡Los peces se escaparon al río!', 'bad');
  setTimeout(() => showModal(false), 900);
}

function showModal(won) {
  $('m-eyebrow').textContent = won ? 'Muy bien' : 'Se escaparon los peces';
  $('m-title').textContent = won ? '¡Palabra adivinada!' : 'Mejor suerte la próxima';
  $('m-word').textContent = state.entry.word;
  $('m-def').textContent = state.entry.def;
  $('modal').classList.add('open');
}

function closeModal() {
  $('modal').classList.remove('open');
}

/* ========================================================
   Eventos
   ======================================================== */
$('category').addEventListener('change', e => {
  state.category = e.target.value;
  newRound();
});
$('hint-btn').addEventListener('click', () => {
  $('hint').classList.toggle('hidden');
});
$('skip-btn').addEventListener('click', newRound);
$('m-btn').addEventListener('click', newRound);
$('audio').addEventListener('click', () => {
  Sound.init();
  Sound.muted = !Sound.muted;
  $('audio').style.opacity = Sound.muted ? '0.5' : '1';
});

window.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if ($('modal').classList.contains('open')) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); newRound(); }
    return;
  }
  const L = e.key.length === 1 ? baseLetter(e.key) : null;
  if (L) guess(L);
});

newRound();
</script>
</body>
</html>
